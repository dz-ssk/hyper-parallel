# 公共 MTP 配置片段。生产训练需要补充数据源，并替换为实际模型维度。
model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_config
  mtp_num_layers: &mtp_depth 1
  mtp_loss_factor: 0.3
  mtp_loss_normalization: &mtp_normalization sequence
  attn_implementation: eager
  config:
    _target_: transformers.AutoConfig.for_model
    model_type: llama
    vocab_size: 32
    hidden_size: 16
    intermediate_size: 32
    num_hidden_layers: 2
    num_attention_heads: 2
    num_key_value_heads: 2
    max_position_embeddings: 32
    rms_norm_eps: 1.0e-6
    attention_dropout: 0.0
    use_cache: false
loss_fn:
  _target_: hyper_parallel.components.losses.ModelOutputLoss
model_init_dtype: float32
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  fp32_main_params: true
dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  get_batch:
    _target_: hyper_parallel.data.batching.mtp.MTPTextParallelBatch
    mtp_num_layers: *mtp_depth
    mtp_loss_normalization: *mtp_normalization
    source_type: online
    attention_mode: dense
accelerator:
  loss_parallel: false
fsdp_config:
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    cast_forward_inputs: false
