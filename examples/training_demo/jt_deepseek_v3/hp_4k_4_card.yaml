model:
  _target_: hyper_parallel.models.jt_deepseek_v3.adapter.jt_builder.build_jt_model
  config:
    architectures:
    - JTDeepseekV3ForCausalLM
    vocab_size: 152064
    hidden_size: 5120
    intermediate_size: 12288
    moe_intermediate_size: 1536
    num_hidden_layers: 2
    num_attention_heads: 128
    num_key_value_heads: 128
    n_shared_experts: 2
    n_routed_experts: 8
    routed_scaling_factor: 2.827
    kv_lora_rank: 512
    q_lora_rank: 1536
    qk_rope_head_dim: 64
    v_head_dim: 128
    qk_nope_head_dim: 128
    n_group: 1
    topk_group: 1
    num_experts_per_tok: 2
    norm_topk_prob: true
    hidden_act: silu
    max_position_embeddings: 262400
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    first_k_dense_replace: 1
    mlp_layer_types:
    - dense
    - sparse
    layer_types:
    - full_attention
    - full_attention
    attention_dropout: 0.0
    rope_parameters:
      rope_type: default
      rope_theta: 5000000
    rope_interleave: true
    tie_word_embeddings: false
    use_cache: false
    attention_bias: false
    mlp_bias: false
    num_nextn_predict_layers: 1
    mtp_loss_factor: 0.3
    use_pad_tokens: true
    moe_aux_loss_coeff: 0.0001
    moe_router_enable_expert_bias: true
    moe_router_bias_update_rate: 0.001
    enable_chunk_loss: true
    chunk_loss_size: 4096
loss_fn:
  _target_: hyper_parallel.components.losses.ModelOutputLoss
model_init_dtype: float32
plan_overrides:
- match:
  - model.layers.*.self_attn
  - mtp.layers.*.transformer_layer.self_attn
  module_type: hyper_parallel.models.jt_deepseek_v3.modeling_jt_deepseek_v3.JTDeepseekV3Attention
  exact_type: true
  replace_module:
    _target_: hyper_parallel.models.jt_deepseek_v3.modeling_jt_deepseek_v3.JTDeepseekV3MLAAttention
- match: '*.self_attn'
  params:
    linear_qkv.weight:
      tp: replicate
    q_b_proj.weight:
      tp: shard(0)
    kv_b_proj.weight:
      tp: shard(0)
    o_proj.weight:
      tp: shard(1)
  region_dispatch: false
  in_src:
    hidden_states:
      tp: shard(1)
  in_dst:
    hidden_states:
      tp: shard(1)
- match: '*.self_attn.*_layernorm'
  in_src:
    hidden_states:
      tp: shard(1)
  in_dst:
    hidden_states:
      tp: shard(1)
  out_src:
    tp: shard(1)
  out_dst:
    tp: replicate
- match: '*.self_attn.key_rope_gather'
  in_src:
    input:
      tp: shard(1)
  in_dst:
    input:
      tp: shard(1)
  out_src:
    tp: shard(1)
  out_dst:
    tp: replicate
- match: '*.mlp.shared_experts'
  params:
    gate_proj.weight:
      tp: replicate
    up_proj.weight:
      tp: replicate
    down_proj.weight:
      tp: replicate
  in_src:
    x:
      tp: shard(1)
  in_dst:
    x:
      tp: shard(1)
  out_src:
    tp: shard(1)
  out_dst:
    tp: shard(1)
- match: mtp.layers.*.eh_proj
  params:
    weight:
      tp: replicate
  in_src:
    input:
      tp: shard(1)
  in_dst:
    input:
      tp: shard(1)
  out_src:
    tp: shard(1)
  out_dst:
    tp: shard(1)
- match: model.layers.[123456789]*.mlp
  when: ep
  region_dispatch: false
  local_compute_fn:
    _target_: hyper_parallel.models.jt_deepseek_v3.adapter.distributed.ep_compute.jt_deepseek_v3_ep_compute_fn
- match: mtp.layers.*.transformer_layer.mlp
  when: ep
  region_dispatch: false
  local_compute_fn:
    _target_: hyper_parallel.models.jt_deepseek_v3.adapter.distributed.ep_compute.jt_deepseek_v3_ep_compute_fn
- match:
  - '*.input_layernorm'
  - '*.post_attention_layernorm'
  - model.norm
  - mtp.layers.*.enorm
  - mtp.layers.*.hnorm
  - mtp.layers.*.final_layernorm
  module_type: transformers.models.deepseek_v32.modeling_deepseek_v32.DeepseekV32RMSNorm
  exact_type: true
  replace_module:
    _target_: hyper_parallel.components.modules.rms_norm.RMSNorm
training:
  train_iters: 2000
  lr_scheduler_iters: 1000
  max_grad_norm: 1.0
  global_batch_size: 4
  micro_batch_size: 1
  backend: hccl
  seed: 42
  enable_full_determinism: true
accelerator:
  tp_size: 1
  ep_size: 1
  cp_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false
fsdp_config:
  dp_shard_size: 4
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    cast_forward_inputs: false
activation_checkpoint:
  mode: 'off'
activation_swap: none
dataset:
  _target_: hyper_parallel.data.online.mapping.MappingTransformDataset
  source_dataset:
    _target_: datasets.load_from_disk
    dataset_path: /workspace/datasets/sft_data_4k_from_256k
  model_assets:
    tokenizer: null
  data_transform:
    _target_: hyper_parallel.data.text.text_transform.PreTokenizedSFTTransform
dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_online_text_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: online
    attention_mode: compressed
    # JT uses continuous RoPE positions; attention remains isolated by document boundaries.
    reset_position_ids: false
    runtime_input_adapter:
      _target_: hyper_parallel.models.jt_deepseek_v3.adapter.data.runtime.JTSequenceRuntime
  sampler_type: single
  drop_last: true
  num_workers: 0
optimizer:
  _target_: hyper_parallel.models.jt_deepseek_v3.adapter.runtime.jt_optimizer.build_optimizer
  fp32_main_params: true
  muon_config:
    lr: 0.0001
    weight_decay: 0.1
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    ns_variant: legacy
    ns_epsilon: 1.0e-07
    matched_adamw_rms: 0.2
  adamw_config:
    adamw_lr: 0.0001
    adamw_weight_decay: 0.1
    adamw_betas:
    - 0.9
    - 0.95
    adamw_eps: 1.0e-08
  qk_clip_threshold: 100.0
lr_scheduler:
  _target_: hyper_parallel.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: constant
  lr_config:
    lr: 0.0001
    min_lr: 0.0001
    lr_warmup_steps: 0
    lr_decay_ratio: 1.0
checkpoint:
  save_ckpt: true
  save_steps: 0
  checkpoint_dir: /workspace/outputs/checkpoints
  restore_from: /home/zth/jt252-4card/weights/fsdp4-step200/global_step_200
  restore_optimizer: true
  restore_train_state: true
  restore_dataloader_state: true
