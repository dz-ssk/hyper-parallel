seed: 42
output_dir: /workspace/outputs/example/output
load_checkpoint: /workspace/checkpoints/full-hidden-step300
load_ckpt_format: safetensors
auto_trans_ckpt: false
only_save_strategy: false
resume_training: true
ignore_data_skip: false
run_mode: train
use_parallel: true
use_legacy: false
print_separate_loss: true
train_precision_sync: true
trainer:
  type: CausalLanguageModelingTrainer
  model_name: deepseekv3
runner_config:
  epochs: 1
  batch_size: 1
  sink_mode: true
  sink_size: 1
  gradient_accumulation_steps: 1
optimizer:
  type: Muon
  adamw_betas:
  - 0.9
  - 0.95
  adamw_eps: 1.0e-08
  weight_decay: 0.1
  matched_adamw_rms: 0.2
  qk_clip_threshold: 100
lr_schedule:
  type: ConstantWarmUpLR
  learning_rate: 1.0e-04
  warmup_steps: 0
  total_steps: 1000
train_dataset: &id001
  data_loader:
    type: HFDataLoader
    load_func: load_from_disk
    dataset_path: /workspace/datasets/sft_data_4k_from_256k
    create_attention_mask: true
    create_compressed_eod_mask: true
    compressed_eod_mask_length: 129
    use_broadcast_data: true
    shuffle: false
    handler:
    - type: rename_column
      original_column_name: cu_seqlens
      new_column_name: actual_seq_len
    - type: remove_columns
      column_names:
      - cu_seqlens_padded
      - real_len
  input_columns:
  - input_ids
  - labels
  - loss_mask
  - position_ids
  - actual_seq_len
  construct_args_key:
  - input_ids
  - labels
  - loss_mask
  - position_ids
  - actual_seq_len
  num_parallel_workers: 1
  python_multiprocessing: false
  drop_remainder: true
  numa_enable: false
  prefetch_size: 1
train_dataset_task:
  type: CausalLanguageModelDataset
  dataset_config: *id001
context:
  mode: 0
  device_target: Ascend
  max_call_depth: 10000
  max_device_memory: 52GB
  save_graphs: false
  save_graphs_path: /workspace/outputs/example/graphs
  device_id: 0
  memory_optimize_level: O0
  jit_config:
    jit_level: O1
  ascend_config:
    parallel_speed_up_json_path: /workspace/mindformers/configs/qwen3/parallel_speed_up.json
parallel_config:
  data_parallel: 2
  model_parallel: 4
  pipeline_stage: 1
  context_parallel: 1
  context_parallel_algo: ulysses_cp
  ulysses_degree_in_cp: 1
# 4 routed experts: EP=1/2/4 are valid; use EP=4 with the current DP=2, TP=4 setup.
  expert_parallel: 4
  micro_batch_num: 1
  use_seq_parallel: true
  gradient_aggregation_group: 4
micro_batch_interleave_num: 1
parallel:
  parallel_mode: 1
  gradients_mean: false
  enable_alltoall: true
  full_batch: false
  dataset_strategy:
  - - 2
    - 1
  - - 2
    - 1
  - - 2
    - 1
  - - 2
    - 1
  - - 2
    - 1
  search_mode: sharding_propagation
  enable_parallel_optimizer: false
  strategy_ckpt_config:
    save_file: /workspace/outputs/example/strategy.ckpt
    only_trainable_params: false
  parallel_optimizer_config:
    gradient_accumulation_shard: false
    parallel_optimizer_threshold: 64
    optimizer_weight_shard_size: 8
  pipeline_config:
    pipeline_interleave: false
    pipeline_scheduler: 1f1b
recompute_config:
  recompute: true
  select_recompute: false
  parallel_optimizer_comm_recompute: false
  mp_comm_recompute: false
  recompute_slice_activation: false
  select_recompute_exclude:
    self_attention\.core_attention\.flash_attention: true
    transformer_layer\.self_attention\.core_attention\.flash_attention: true
model:
  model_config:
    model_type: deepseek_v3
    architectures:
    - DeepseekV3ForCausalLM
    batch_size: 1
    offset: 0
    pp_interleave_num: 1
    vocab_size: 152064
    seq_length: 4096
    # 4K width scaling: hidden is halved from the 236B baseline to control memory.
    hidden_size: 5120
    # Keep the dense FFN/hidden ratio after scaling; 12288 -> 6144.
    intermediate_size: 12288
    # Required structure: 2 main layers = 1 dense layer + 1 MoE layer.
    num_hidden_layers: 2
    max_position_embeddings: 262400
    hidden_act: silu
    # Halve head count with hidden size so per-head width stays consistent.
    num_attention_heads: 128
    rms_norm_eps: 1.0e-06
    add_bias_linear: false
    use_flash_attention: true
    multi_latent_attention: true
    mla_qkv_concat: false
    # Scale MLA latent ranks with hidden size; keep per-head MLA geometry below unchanged.
    kv_lora_rank: 512
    q_lora_rank: 1536
    # Keep the baseline per-head RoPE/nope/value dimensions unchanged.
    qk_rope_head_dim: 64
    v_head_dim: 128
    qk_nope_head_dim: 128
    qk_layernorm: true
    position_embedding_type: rope
    rope_theta: 5000000
    rotary_scaling_factor: 1
    beta_fast: 32
    beta_slow: 1
    mscale: 1
    mscale_all_dim: 1
    attention_dropout: 0.0
    hidden_dropout: 0.0
    params_dtype: float32
    compute_dtype: bfloat16
    layernorm_compute_dtype: float32
    softmax_compute_dtype: float32
    rotary_dtype: float32
    initializer_range: 0.02
    # Required: one MTP layer.
    num_nextn_predict_layers: 1
    mtp_loss_factor: 0.3
    router_dense_type: float32
    gated_linear_unit: true
    moe_grouped_gemm: true
    use_fused_ops_topkrouter: true
    # Required structure: first main layer dense, second main layer MoE.
    first_k_dense_replace: 1
    # Scale per-expert FFN width with hidden size; 1536 -> 768.
    moe_intermediate_size: 1536
    n_shared_experts: 2
    routed_scaling_factor: 2.827
    # Keep top-k=2; four routed experts allow expert parallelism up to EP=4.
    n_routed_experts: 8
    num_experts_per_tok: 2
    scoring_func: sigmoid
    norm_topk_prob: true
    topk_group: 1
    n_group: 1
    use_pad_tokens: true
    moe_token_dispatcher_type: alltoall
    npu_nums_per_device: 8
    moe_router_load_balancing_type: seq_aux_loss
    moe_aux_loss_coeff: 0.0001
    moe_token_drop_policy: false
    moe_router_enable_expert_bias: true
    moe_router_bias_update_rate: 0.001
callbacks:
- type: MFLossMonitor
- type: TopkBiasBalanceCallback
- type: CheckpointMonitor
  save_checkpoint_steps: 1000
- type: TrainCallBack
  stop_step: 10
runner_wrapper:
  type: MFTrainOneStepCell
  scale_sense: 1.0
  use_clip_grad: true
profile: false
profile_start_step: 5
profile_stop_step: 6
init_start_profile: true
profile_communication: false
profile_memory: false
profile_pipeline: false
with_stack: false
profiler_level: 0
data_simplification: true
mstx: true
