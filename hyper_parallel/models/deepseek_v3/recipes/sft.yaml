# Run the configured SFT model through the standard Trainer training loop.
# Provide the reference configuration and its exported initial weights.
model:
  _target_: hyper_parallel.models.deepseek_v3.adapter.sft_builder.build_sft_model
  reference_yaml: /path/to/reference.yaml
  reference_weights: /path/to/initial_weights
loss_fn:
  _target_: hyper_parallel.models.deepseek_v3.adapter.runtime.sft_loss.DeepseekV32SFTLoss
model_init_dtype: float32
plan_overrides:
  # Replace the complete reference decoder.  Its factory composes the PR
  # Attention/Norm/MLP/Experts children so no parent/child targets overlap.
  - match:
      - "model.layers.0"
      - "model.layers.1"
      - "mtp.layers.0.transformer_layer"
    module_type: hyper_parallel.models.deepseek_v3.modeling_deepseek_v32_sft.DeepseekV32SFTDecoder
    exact_type: true
    replace_module:
      _target_: hyper_parallel.models.deepseek_v3.adapter.conversion.reference_modules.DeepseekV32SFTDecoder
  # The complete base keeps these reference norms; the recipe selects the
  # original fused NPU implementation only for the reference execution path.
  - match:
      - "model.norm"
      - "mtp.layers.0.enorm"
      - "mtp.layers.0.hnorm"
      - "mtp.layers.0.final_layernorm"
    module_type: hyper_parallel.models.deepseek_v3.modeling_deepseek_v32_sft.DeepseekV32SFTRMSNorm
    exact_type: true
    replace_module:
      _target_: hyper_parallel.models.deepseek_v3.adapter.conversion.reference_modules.DeepseekV32SFTRMSNorm
  - match: "*.self_attn"
    params:
      linear_qkv.weight: {tp: replicate}
      q_b_proj.weight: {tp: "shard(0)"}
      kv_b_proj.weight: {tp: "shard(0)"}
      o_proj.weight: {tp: "shard(1)"}
    region_dispatch: false
  - match: "*.self_attn.*_layernorm"
    in_src:
      hidden_states: {tp: replicate}
    in_dst:
      hidden_states: {tp: replicate}
    out_src: {tp: replicate}
    out_dst: {tp: replicate}
  - match: "*.mlp.shared_experts"
    params:
      gate_proj.weight: {tp: replicate}
      up_proj.weight: {tp: replicate}
      down_proj.weight: {tp: replicate}
    in_src:
      x: {tp: "shard(1)"}
    in_dst:
      x: {tp: "shard(1)"}
    out_src: {tp: "shard(1)"}
    out_dst: {tp: "shard(1)"}
  - match: "mtp.layers.*.eh_proj"
    params:
      weight: {tp: replicate}
    in_src:
      input: {tp: "shard(1)"}
    in_dst:
      input: {tp: "shard(1)"}
    out_src: {tp: "shard(1)"}
    out_dst: {tp: "shard(1)"}
  - match: "mtp.layers.*.transformer_layer.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.models.deepseek_v3.adapter.distributed.sft_expert_parallel.deepseek_v32_sft_ep_compute
training:
  train_iters: 1
  global_batch_size: 1
  micro_batch_size: 1
  backend: hccl
  init_device: cpu
  seed: 42
  enable_full_determinism: true
accelerator:
  tp_size: 8
  ep_size: 8
  cp_size: 1
  pp_size: 1
  sequence_parallel: true
  loss_parallel: true
fsdp_config:
  dp_shard_size: 1
activation_checkpoint:
  mode: "off"
activation_swap: none
dataset:
  _target_: hyper_parallel.models.deepseek_v3.adapter.runtime.sft_data.NpzSFTDataset
  data_path: /path/to/shared_tokens.npz
  model_assets:
    tokenizer: null
  data_transform: null
dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_default_collate_fn
  get_batch:
    _target_: hyper_parallel.models.deepseek_v3.adapter.runtime.sft_data.PreShiftedSFTBatch
  sampler_type: single
  drop_last: true
  num_workers: 0
# Generic training connectivity only; reference optimizer trajectory is a later stage.
optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  adamw_config:
    adamw_lr: 2.4e-5
    adamw_weight_decay: 0.0
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8
lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: constant
  lr_config:
    lr: 2.4e-5
    lr_warmup_steps: 0
    min_lr: 2.4e-5
checkpoint:
  save_ckpt: false
  checkpoint_dir: ./outputs/deepseek_v32_sft
