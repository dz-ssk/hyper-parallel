# Small CPU/unit-test model; replace dimensions with your production model.
# Merge this model fragment into a Trainer YAML with your existing data/optimizer.
model:
  _target_: hyper_parallel.models.deepseek_v3.adapter.mtp.build_model
  mtp_num_layers: &mtp_depth 1
  mtp_loss_factor: 0.3
  mtp_loss_normalization: &mtp_normalization sequence
  attn_implementation: eager
  config:
    vocab_size: 32
    hidden_size: 16
    intermediate_size: 32
    moe_intermediate_size: 8
    num_hidden_layers: 2
    num_attention_heads: 2
    num_key_value_heads: 2
    n_shared_experts: 1
    n_routed_experts: 4
    num_experts_per_tok: 2
    n_group: 1
    topk_group: 1
    first_k_dense_replace: 1
    q_lora_rank: 8
    kv_lora_rank: 4
    qk_nope_head_dim: 4
    qk_rope_head_dim: 4
    v_head_dim: 4
    max_position_embeddings: 32
    rms_norm_eps: 1.0e-6
    attention_dropout: 0.0
    use_cache: false
loss_fn:
  _target_: hyper_parallel.components.losses.ModelOutputLoss
model_init_dtype: float32
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  fp32_main_params: true

# Keep the model and batch depth/normalization identical. Dataset selection is
# caller-owned. Dense attention preserves explicit packed-document boundaries.
dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  get_batch:
    _target_: hyper_parallel.models.deepseek_v3.adapter.mtp_data.MTPTextParallelBatch
    mtp_num_layers: *mtp_depth
    mtp_loss_normalization: *mtp_normalization
    source_type: online
    attention_mode: dense
accelerator:
  loss_parallel: false
fsdp_config:
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    cast_forward_inputs: false
